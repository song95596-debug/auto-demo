name: 定时生成日志

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 生成日志
        run: |
          echo "任务执行时间: $(date)" >> log.txt

      - name: 提交文件
        run: |
          git config --global user.name "github‑actions‑bot"
          git config --global user.email "actions@github.com"
          git add log.txt
          git commit -m "自动更新日志 $(date)"
          git push
