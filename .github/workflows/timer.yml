name: 定时抓取网页数据

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 获取网页标题
        run: |
          page_title=$(curl -s https://www.baidu.com | grep -o '<title>.*</title>')
          echo "【ST】抓取时刻: $(date) ,网页标题: $page_title" >> log.txt

      - name: 提交推送
        run: |
          git config --global user.name "github‑actions‑bot"
          git config --global user.email "actions@github.com"
          git add log.txt
          git commit -m "网页抓取更新 $(date)"
          git push
